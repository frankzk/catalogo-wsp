name: Deploy catálogo a GitHub Pages

# Solo 'main' publica el sitio. Las ramas de trabajo NO deben desplegar:
# GitHub Pages hospeda un único despliegue, así que un deploy desde una rama
# que va detrás de main sobrescribe (pisa) el sitio bueno y tumba secciones
# que aún no existen en esa rama (esto causó la caída de aurela-peru).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no cancelar el que esté en curso (evita cortar un deploy bueno).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
